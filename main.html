<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Slides for ICTP - PWF Honduras: Machine Learning & Data Science">
  <title>Slides | ICTP - PWF Honduras</title>
  <style>
    :root {
      color-scheme: light;
      --background: #FFFDF8;
      --text: #282A36;
      --heading: #1F3A5F;
      --link: #2468A0;
      --link-hover: #D64545;
      --gold: #D99A00;
      --gold-light: #FFF8E6;
      --border: #E5E1D6;
      --muted: #777777;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 4rem 1.25rem;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    header {
      margin-bottom: 2.25rem;
      padding-bottom: 1.15rem;
      border-bottom: 3px solid #E3B52F;
    }

    h1 {
      margin: 0 0 0.35rem;
      color: var(--heading);
      font-size: clamp(2.5rem, 7vw, 3.6rem);
      font-weight: 750;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }

    .subtitle {
      margin: 0.7rem 0 0;
      color: var(--text);
      font-size: clamp(1.05rem, 3vw, 1.3rem);
      font-weight: 700;
    }

    .eyebrow {
      margin: 0 0 0.45rem;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    ul {
      display: grid;
      gap: 0.85rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.15rem;
      border: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      border-radius: 7px;
      background: #FFFFFF;
      color: var(--link);
      font-size: 1.05rem;
      font-weight: 650;
      text-decoration: none;
      transition: border-color 140ms ease, background 140ms ease,
                  transform 140ms ease;
    }

    li a::after {
      content: "↗";
      color: var(--gold);
      font-size: 1.15rem;
    }

    li a:hover, li a:focus-visible {
      border-color: #E3B52F;
      background: var(--gold-light);
      color: var(--link-hover);
      transform: translateX(3px);
      outline: none;
    }

    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.88rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Slides</h1>
      <p class="subtitle">ICTP - PWF Honduras: Machine Learning &amp; Data Science</p>
    </header>

    <section aria-labelledby="slides-heading">
      <p class="eyebrow" id="slides-heading">Course presentations</p>
      <ul>
        <li><a href="https://carlossoto362.github.io/pwf_honduras_slides/PCA1.html">PCA 1</a></li>
        <li><a href="https://carlossoto362.github.io/pwf_honduras_slides/PCA2.html">PCA 2</a></li>
	<ul><li><a href="https://colab.research.google.com/github/carlossoto362/pwf_honduras_slides/blob/main/PCA_emnist.ipynb">Colab link: PCA con EMNIST</a></li></ul>
        <li><a href="https://carlossoto362.github.io/pwf_honduras_slides/Regresion_lineal_dia2.html">Regresion Lineal</a></li>
        <li><a href="https://carlossoto362.github.io/pwf_honduras_slides/algoritmos_de_minimizacion.html">Algoritmos de optimización</a></li>
      </ul>
    </section>

    <footer>
      ICTP - PWF Honduras · Machine Learning &amp; Data Science
    </footer>
  </main>
</body>
</html>
